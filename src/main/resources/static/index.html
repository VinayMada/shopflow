<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080810;
      --surface:   #10101c;
      --card:      #16162a;
      --card2:     #1e1e36;
      --border:    #252545;
      --primary:   #6366f1;
      --primary-d: #4f52d4;
      --accent:    #a855f7;
      --glow:      rgba(99,102,241,.35);
      --text:      #eeeeff;
      --muted:     #7878a0;
      --success:   #22c55e;
      --danger:    #ef4444;
      --warning:   #f59e0b;
      --radius:    14px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── NAV ── */
    nav {
      position: sticky; top: 0; z-index: 200;
      display: flex; align-items: center; gap: 1rem;
      padding: .9rem 2rem;
      background: rgba(8,8,16,.82);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-size: 1.4rem; font-weight: 900; letter-spacing: -.5px;
      background: linear-gradient(135deg,#6366f1,#a855f7);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      cursor: pointer; margin-right: auto;
    }
    .nav-link {
      background: none; border: none; color: var(--muted);
      font: inherit; font-size: .9rem; font-weight: 500;
      cursor: pointer; padding: .4rem .8rem; border-radius: 8px;
      transition: color .2s, background .2s;
    }
    .nav-link:hover, .nav-link.active { color: var(--text); background: var(--card2); }
    .cart-btn {
      position: relative; background: none; border: none;
      cursor: pointer; font-size: 1.3rem; padding: .4rem .6rem;
      border-radius: 8px; transition: background .2s;
    }
    .cart-btn:hover { background: var(--card2); }
    .cart-badge {
      position: absolute; top: 2px; right: 2px;
      background: var(--primary); color: #fff;
      font-size: .62rem; font-weight: 700;
      width: 16px; height: 16px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      display: none;
    }
    .auth-btn {
      background: linear-gradient(135deg,var(--primary),var(--accent));
      border: none; color: #fff; font: inherit;
      font-size: .85rem; font-weight: 600;
      padding: .5rem 1.2rem; border-radius: 8px; cursor: pointer;
      transition: opacity .2s, transform .15s;
    }
    .auth-btn:hover { opacity: .88; transform: translateY(-1px); }
    .user-chip {
      display: flex; align-items: center; gap: .5rem;
      background: var(--card2); border: 1px solid var(--border);
      border-radius: 8px; padding: .4rem .9rem;
      font-size: .85rem;
    }
    .user-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--success);
    }
    .logout-btn {
      background: none; border: none; color: var(--danger);
      font: inherit; font-size: .8rem; cursor: pointer;
      margin-left: .4rem; opacity: .8;
    }
    .logout-btn:hover { opacity: 1; }

    /* ── HERO ── */
    .hero {
      text-align: center; padding: 4.5rem 2rem 3rem;
      background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(99,102,241,.18), transparent);
    }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.6rem);
      font-weight: 900; letter-spacing: -1.5px;
      background: linear-gradient(135deg,#fff 30%,#a855f7);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: .8rem;
    }
    .hero p { color: var(--muted); font-size: 1.05rem; font-weight: 400; }

    /* ── FILTERS ── */
    .filters {
      display: flex; flex-wrap: wrap; gap: .6rem;
      padding: 0 2rem 1.5rem;
      justify-content: center;
    }
    .filter-chip {
      background: var(--card); border: 1px solid var(--border);
      color: var(--muted); font: inherit; font-size: .82rem; font-weight: 500;
      padding: .4rem 1rem; border-radius: 100px; cursor: pointer;
      transition: all .2s;
    }
    .filter-chip:hover { border-color: var(--primary); color: var(--text); }
    .filter-chip.active {
      background: var(--primary); border-color: var(--primary);
      color: #fff;
      box-shadow: 0 0 16px var(--glow);
    }

    /* ── PRODUCTS GRID ── */
    .products-section { padding: 0 2rem 4rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.2rem;
    }
    .product-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.4rem;
      display: flex; flex-direction: column; gap: .8rem;
      transition: transform .25s, border-color .25s, box-shadow .25s;
      cursor: default;
    }
    .product-card:hover {
      transform: translateY(-4px);
      border-color: rgba(99,102,241,.5);
      box-shadow: 0 8px 32px rgba(99,102,241,.18);
    }
    .product-icon {
      width: 48px; height: 48px; border-radius: 12px;
      background: linear-gradient(135deg,var(--primary),var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
    }
    .product-name {
      font-size: 1rem; font-weight: 700; color: var(--text);
      line-height: 1.3;
    }
    .product-desc {
      font-size: .8rem; color: var(--muted);
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .product-footer {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: auto;
    }
    .product-price {
      font-size: 1.15rem; font-weight: 800;
      background: linear-gradient(135deg,var(--primary),var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .product-stock {
      font-size: .72rem; color: var(--muted);
    }
    .add-btn {
      background: linear-gradient(135deg,var(--primary),var(--accent));
      border: none; color: #fff; font: inherit;
      font-size: .8rem; font-weight: 600;
      padding: .45rem .95rem; border-radius: 8px; cursor: pointer;
      transition: opacity .2s, transform .15s;
      white-space: nowrap;
    }
    .add-btn:hover { opacity: .85; transform: scale(1.04); }
    .add-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    /* ── SKELETON ── */
    .skeleton {
      background: linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);
      background-size: 200%;
      animation: shimmer 1.4s infinite;
      border-radius: 8px;
    }
    @keyframes shimmer { 0%{background-position:200%} 100%{background-position:-200%} }
    .skel-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.4rem;
      display: flex; flex-direction: column; gap: .8rem;
    }
    .skel-icon { width:48px; height:48px; border-radius:12px; }
    .skel-title { height:16px; width:70%; }
    .skel-desc { height:12px; width:100%; }
    .skel-desc2 { height:12px; width:60%; }
    .skel-btn { height:32px; width:80px; border-radius:8px; }

    /* ── PAGINATION ── */
    .pagination {
      display: flex; align-items: center; justify-content: center;
      gap: .5rem; margin-top: 2rem;
    }
    .page-btn {
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); font: inherit; font-size: .85rem;
      padding: .4rem .9rem; border-radius: 8px; cursor: pointer;
      transition: all .2s;
    }
    .page-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .page-btn:disabled { opacity: .35; cursor: not-allowed; }
    .page-btn.current { background: var(--primary); border-color: var(--primary); }
    .page-info { color: var(--muted); font-size: .82rem; }

    /* ── CART DRAWER ── */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.6);
      backdrop-filter: blur(4px);
      z-index: 300; opacity: 0; pointer-events: none;
      transition: opacity .3s;
    }
    .overlay.open { opacity: 1; pointer-events: auto; }
    .cart-drawer {
      position: fixed; right: 0; top: 0; bottom: 0; width: 420px; max-width: 95vw;
      background: var(--surface); border-left: 1px solid var(--border);
      z-index: 400; display: flex; flex-direction: column;
      transform: translateX(100%); transition: transform .35s cubic-bezier(.4,0,.2,1);
    }
    .cart-drawer.open { transform: none; }
    .drawer-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.4rem 1.6rem;
      border-bottom: 1px solid var(--border);
    }
    .drawer-title { font-size: 1.1rem; font-weight: 700; }
    .close-btn {
      background: none; border: none; color: var(--muted);
      font-size: 1.4rem; cursor: pointer; padding: .2rem .5rem;
      border-radius: 6px; transition: color .2s, background .2s;
      line-height: 1;
    }
    .close-btn:hover { color: var(--text); background: var(--card); }
    .cart-items { flex: 1; overflow-y: auto; padding: 1rem 1.6rem; }
    .cart-empty {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; gap: 1rem;
      color: var(--muted);
    }
    .cart-empty-icon { font-size: 3rem; opacity: .4; }
    .cart-item {
      display: flex; align-items: center; gap: 1rem;
      padding: .9rem 0; border-bottom: 1px solid var(--border);
    }
    .cart-item:last-child { border-bottom: none; }
    .ci-icon {
      width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0;
      background: linear-gradient(135deg,var(--primary),var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
    }
    .ci-info { flex: 1; }
    .ci-name { font-size: .9rem; font-weight: 600; margin-bottom: .2rem; }
    .ci-price { font-size: .8rem; color: var(--muted); }
    .ci-qty {
      font-size: .8rem; font-weight: 600;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 6px; padding: .2rem .5rem;
    }
    .ci-remove {
      background: none; border: none; color: var(--danger);
      cursor: pointer; font-size: 1rem; padding: .3rem;
      border-radius: 6px; transition: background .2s; opacity: .7;
    }
    .ci-remove:hover { background: rgba(239,68,68,.12); opacity: 1; }
    .cart-footer { padding: 1.2rem 1.6rem; border-top: 1px solid var(--border); }
    .cart-total {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1rem;
    }
    .cart-total-label { font-size: .9rem; color: var(--muted); }
    .cart-total-value { font-size: 1.3rem; font-weight: 800; }
    .order-btn {
      width: 100%;
      background: linear-gradient(135deg,var(--primary),var(--accent));
      border: none; color: #fff; font: inherit;
      font-size: .95rem; font-weight: 700;
      padding: .85rem; border-radius: var(--radius); cursor: pointer;
      transition: opacity .2s, transform .15s;
      box-shadow: 0 4px 20px var(--glow);
    }
    .order-btn:hover { opacity: .88; transform: translateY(-1px); }
    .order-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    /* ── ORDERS VIEW ── */
    .orders-section { padding: 2rem; max-width: 820px; margin: 0 auto; }
    .orders-section h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 1.5rem; }
    .order-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.4rem;
      margin-bottom: 1rem;
      transition: border-color .2s;
    }
    .order-card:hover { border-color: rgba(99,102,241,.4); }
    .order-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem;
    }
    .order-id { font-size: .8rem; color: var(--muted); }
    .order-id span { font-weight: 700; color: var(--text); }
    .status-badge {
      font-size: .72rem; font-weight: 700; letter-spacing: .5px;
      padding: .3rem .7rem; border-radius: 100px; text-transform: uppercase;
    }
    .status-PENDING   { background: rgba(245,158,11,.15); color: var(--warning); }
    .status-CONFIRMED { background: rgba(99,102,241,.15); color: var(--primary); }
    .status-PROCESSING{ background: rgba(168,85,247,.15); color: var(--accent); }
    .status-SHIPPED   { background: rgba(34,197,94,.1);  color: var(--success); }
    .status-DELIVERED { background: rgba(34,197,94,.18); color: var(--success); }
    .status-CANCELLED { background: rgba(239,68,68,.12); color: var(--danger); }
    .order-items-list { display: flex; flex-direction: column; gap: .4rem; margin-bottom: .8rem; }
    .oi-row { display: flex; justify-content: space-between; font-size: .85rem; }
    .oi-name { color: var(--muted); }
    .oi-subtotal { font-weight: 600; }
    .order-total-row {
      display: flex; justify-content: space-between;
      padding-top: .8rem; border-top: 1px solid var(--border);
      font-weight: 700;
    }

    /* ── AUTH MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.7); backdrop-filter: blur(8px);
      z-index: 500; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .3s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 2.2rem;
      width: 400px; max-width: 95vw;
      transform: translateY(20px) scale(.97);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 24px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(99,102,241,.15);
    }
    .modal-overlay.open .modal { transform: none; }
    .modal-logo {
      text-align: center; font-size: 1.6rem; font-weight: 900;
      background: linear-gradient(135deg,#6366f1,#a855f7);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: .3rem;
    }
    .modal-sub { text-align: center; color: var(--muted); font-size: .85rem; margin-bottom: 1.8rem; }
    .modal-tabs {
      display: flex; border: 1px solid var(--border);
      border-radius: 10px; margin-bottom: 1.6rem; overflow: hidden;
    }
    .modal-tab {
      flex: 1; background: none; border: none; font: inherit;
      font-size: .88rem; font-weight: 600; color: var(--muted);
      padding: .65rem; cursor: pointer; transition: all .2s;
    }
    .modal-tab.active { background: var(--primary); color: #fff; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: .78rem; font-weight: 600; color: var(--muted); margin-bottom: .4rem; letter-spacing: .3px; }
    input[type=text], input[type=email], input[type=password] {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); font: inherit;
      font-size: .9rem; padding: .7rem 1rem;
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--glow); }
    .form-btn {
      width: 100%; margin-top: .4rem;
      background: linear-gradient(135deg,var(--primary),var(--accent));
      border: none; color: #fff; font: inherit;
      font-size: .95rem; font-weight: 700;
      padding: .8rem; border-radius: 10px; cursor: pointer;
      transition: opacity .2s; box-shadow: 0 4px 20px var(--glow);
    }
    .form-btn:hover { opacity: .88; }
    .form-btn:disabled { opacity: .5; cursor: not-allowed; }
    .form-error { color: var(--danger); font-size: .8rem; margin-top: .8rem; text-align: center; }

    /* ── TOAST ── */
    #toasts {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      display: flex; flex-direction: column; gap: .5rem;
      z-index: 900;
    }
    .toast {
      background: var(--card2); border: 1px solid var(--border);
      border-radius: 10px; padding: .8rem 1.2rem;
      font-size: .85rem; font-weight: 500;
      display: flex; align-items: center; gap: .6rem;
      animation: slideUp .3s ease;
      max-width: 320px; box-shadow: 0 4px 20px rgba(0,0,0,.4);
    }
    @keyframes slideUp { from{transform:translateY(12px);opacity:0} to{transform:none;opacity:1} }
    .toast.success { border-color: rgba(34,197,94,.4); }
    .toast.error   { border-color: rgba(239,68,68,.4); }
    .toast-icon { font-size: 1rem; }

    /* ── MISC ── */
    .empty-state {
      text-align: center; padding: 4rem 2rem; color: var(--muted);
    }
    .empty-state .big { font-size: 3rem; margin-bottom: 1rem; opacity:.4; }
    .empty-state p { font-size: .95rem; }

    .view { display: none; }
    .view.active { display: block; }

    @media(max-width: 600px) {
      nav { padding: .8rem 1rem; }
      .hero { padding: 3rem 1rem 2rem; }
      .filters, .products-section, .orders-section { padding-left: 1rem; padding-right: 1rem; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="logo" onclick="showView('products')">⚡ ShopFlow</div>
  <button class="nav-link active" id="nav-products" onclick="showView('products')">Products</button>
  <button class="nav-link"        id="nav-orders"   onclick="showView('orders')">Orders</button>
  <button class="cart-btn" onclick="openCart()" title="Cart">
    🛒
    <span class="cart-badge" id="cart-badge"></span>
  </button>
  <div id="auth-area"></div>
</nav>

<!-- VIEWS -->
<div id="view-products" class="view active">
  <div class="hero">
    <h1>Shop Everything ✨</h1>
    <p>Premium products, curated just for you.</p>
  </div>
  <div class="filters" id="filters">
    <button class="filter-chip active" data-id="" onclick="selectCategory(this, null)">All</button>
  </div>
  <div class="products-section">
    <div class="grid" id="product-grid"></div>
    <div class="pagination" id="pagination"></div>
  </div>
</div>

<div id="view-orders" class="view">
  <div class="orders-section">
    <h2>Your Orders</h2>
    <div id="orders-list"></div>
  </div>
</div>

<!-- CART DRAWER -->
<div class="overlay" id="overlay" onclick="closeCart()"></div>
<div class="cart-drawer" id="cart-drawer">
  <div class="drawer-header">
    <span class="drawer-title">🛒 Your Cart</span>
    <button class="close-btn" onclick="closeCart()">✕</button>
  </div>
  <div class="cart-items" id="cart-items"></div>
  <div class="cart-footer" id="cart-footer" style="display:none">
    <div class="cart-total">
      <span class="cart-total-label">Total</span>
      <span class="cart-total-value" id="cart-total-value">₹0.00</span>
    </div>
    <button class="order-btn" onclick="placeOrder()">Place Order 🚀</button>
  </div>
</div>

<!-- AUTH MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-logo">ShopFlow</div>
    <div class="modal-sub">Sign in to shop</div>
    <div class="modal-tabs">
      <button class="modal-tab active" id="tab-login"    onclick="switchTab('login')">Login</button>
      <button class="modal-tab"        id="tab-register" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Login form -->
    <div id="form-login">
      <div class="form-group">
        <label>EMAIL</label>
        <input type="email" id="login-email" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>PASSWORD</label>
        <input type="password" id="login-pass" placeholder="••••••••" />
      </div>
      <button class="form-btn" onclick="doLogin()">Sign In</button>
      <div class="form-error" id="login-err"></div>
    </div>

    <!-- Register form -->
    <div id="form-register" style="display:none">
      <div class="form-group">
        <label>FULL NAME</label>
        <input type="text" id="reg-name" placeholder="John Doe" />
      </div>
      <div class="form-group">
        <label>EMAIL</label>
        <input type="email" id="reg-email" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>PASSWORD</label>
        <input type="password" id="reg-pass" placeholder="At least 6 characters" />
      </div>
      <button class="form-btn" onclick="doRegister()">Create Account</button>
      <div class="form-error" id="reg-err"></div>
    </div>
  </div>
</div>

<!-- TOASTS -->
<div id="toasts"></div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────────────
let state = {
  token:    localStorage.getItem('sf_token') || null,
  email:    localStorage.getItem('sf_email') || null,
  cart:     null,
  page:     0,
  totalPages: 0,
  categoryId: null,
  products: [],
  categories: [],
};

// ── API ───────────────────────────────────────────────────────────────────────
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (state.token) headers['Authorization'] = `Bearer ${state.token}`;
  const res = await fetch('/api' + path, { headers, ...opts });
  if (res.status === 401) { logout(); return null; }
  if (res.status === 204 || res.status === 201 && opts.method === 'DELETE') return null;
  const text = await res.text();
  if (!text) return null;
  const data = JSON.parse(text);
  if (!res.ok) throw new Error(data.message || data.error || `HTTP ${res.status}`);
  return data;
}

// ── AUTH ──────────────────────────────────────────────────────────────────────
function renderAuthArea() {
  const el = document.getElementById('auth-area');
  if (state.token) {
    el.innerHTML = `
      <div class="user-chip">
        <span class="user-dot"></span>
        <span style="font-size:.82rem;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${state.email}</span>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>`;
  } else {
    el.innerHTML = `<button class="auth-btn" onclick="openModal()">Sign In</button>`;
  }
}

function openModal()  { document.getElementById('modal-overlay').classList.add('open'); }
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

function switchTab(t) {
  ['login','register'].forEach(x => {
    document.getElementById('tab-'+x).classList.toggle('active', x===t);
    document.getElementById('form-'+x).style.display = x===t ? '' : 'none';
  });
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pass').value;
  const btn = document.querySelector('#form-login .form-btn');
  document.getElementById('login-err').textContent = '';
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const data = await api('/auth/login', {
      method: 'POST',
      body: JSON.stringify({ email, password }),
    });
    if (data) { saveAuth(data.token, email); closeModal(); toast('Welcome back! 👋', 'success'); loadCart(); }
  } catch(e) {
    document.getElementById('login-err').textContent = e.message;
  }
  btn.disabled = false; btn.textContent = 'Sign In';
}

async function doRegister() {
  const name     = document.getElementById('reg-name').value.trim();
  const email    = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-pass').value;
  const btn = document.querySelector('#form-register .form-btn');
  document.getElementById('reg-err').textContent = '';
  btn.disabled = true; btn.textContent = 'Creating account…';
  try {
    const data = await api('/auth/register', {
      method: 'POST',
      body: JSON.stringify({ name, email, password }),
    });
    if (data) { saveAuth(data.token, email); closeModal(); toast('Account created! 🎉', 'success'); loadCart(); }
  } catch(e) {
    document.getElementById('reg-err').textContent = e.message;
  }
  btn.disabled = false; btn.textContent = 'Create Account';
}

function saveAuth(token, email) {
  state.token = token; state.email = email;
  localStorage.setItem('sf_token', token);
  localStorage.setItem('sf_email', email);
  renderAuthArea();
}

function logout() {
  state.token = null; state.email = null; state.cart = null;
  localStorage.removeItem('sf_token'); localStorage.removeItem('sf_email');
  renderAuthArea(); updateCartBadge(); closeCart();
  toast('Logged out', 'success');
}

// ── VIEW ROUTING ──────────────────────────────────────────────────────────────
function showView(v) {
  ['products','orders'].forEach(x => {
    document.getElementById('view-'+x).classList.toggle('active', x===v);
    document.getElementById('nav-'+x).classList.toggle('active', x===v);
  });
  if (v === 'orders') loadOrders();
}

// ── CATEGORIES ────────────────────────────────────────────────────────────────
async function loadCategories() {
  try {
    const list = await api('/categories');
    if (!list) return;
    state.categories = list;
    const bar = document.getElementById('filters');
    list.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'filter-chip';
      btn.dataset.id = c.id;
      btn.textContent = c.name;
      btn.onclick = () => selectCategory(btn, c.id);
      bar.appendChild(btn);
    });
  } catch(_) {}
}

function selectCategory(btn, id) {
  document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.categoryId = id;
  state.page = 0;
  loadProducts();
}

// ── PRODUCTS ──────────────────────────────────────────────────────────────────
const ICONS = ['📦','🎧','👟','📱','💡','🖥️','🎮','⌚','🎒','📚','🍃','✨'];
function productIcon(id) { return ICONS[id % ICONS.length]; }

async function loadProducts() {
  const grid = document.getElementById('product-grid');
  grid.innerHTML = Array(8).fill(`
    <div class="skel-card">
      <div class="skel-icon skeleton"></div>
      <div class="skel-title skeleton"></div>
      <div class="skel-desc skeleton"></div>
      <div class="skel-desc2 skeleton"></div>
      <div style="display:flex;justify-content:space-between;margin-top:auto">
        <div class="skel-btn skeleton"></div>
        <div class="skel-btn skeleton"></div>
      </div>
    </div>`).join('');

  try {
    let url = `/products?page=${state.page}&size=12&sort=id,asc`;
    if (state.categoryId) url += `&categoryId=${state.categoryId}`;
    const data = await api(url);
    if (!data) { grid.innerHTML = ''; return; }
    state.products = data.content;
    state.totalPages = data.totalPages;
    renderProducts(data.content);
    renderPagination(data.page, data.totalPages);
  } catch(e) {
    grid.innerHTML = `<div style="grid-column:1/-1"><div class="empty-state"><p>Could not load products: ${e.message}</p></div></div>`;
  }
}

function renderProducts(products) {
  const grid = document.getElementById('product-grid');
  if (!products.length) {
    grid.innerHTML = `<div style="grid-column:1/-1"><div class="empty-state"><div class="big">🔍</div><p>No products found.</p></div></div>`;
    return;
  }
  grid.innerHTML = products.map(p => `
    <div class="product-card">
      <div class="product-icon">${productIcon(p.id)}</div>
      <div class="product-name">${esc(p.name)}</div>
      <div class="product-desc">${esc(p.description || 'No description available.')}</div>
      <div class="product-footer">
        <div>
          <div class="product-price">₹${fmt(p.price)}</div>
          <div class="product-stock">${p.stock > 0 ? `${p.stock} in stock` : '⚠ Out of stock'}</div>
        </div>
        <button class="add-btn" ${p.stock===0?'disabled':''} onclick="addToCart(${p.id}, this)">
          ${p.stock===0 ? 'Sold Out' : '+ Add'}
        </button>
      </div>
    </div>`).join('');
}

function renderPagination(page, total) {
  const el = document.getElementById('pagination');
  if (total <= 1) { el.innerHTML = ''; return; }
  const prev = page > 0;
  const next = page < total - 1;
  el.innerHTML = `
    <button class="page-btn" ${prev?'':'disabled'} onclick="goPage(${page-1})">← Prev</button>
    <span class="page-info">Page ${page+1} of ${total}</span>
    <button class="page-btn" ${next?'':'disabled'} onclick="goPage(${page+1})">Next →</button>`;
}

function goPage(p) { state.page = p; loadProducts(); window.scrollTo({top:0,behavior:'smooth'}); }

// ── CART ──────────────────────────────────────────────────────────────────────
async function loadCart() {
  if (!state.token) return;
  try {
    const cart = await api('/cart');
    state.cart = cart;
    updateCartBadge();
    if (document.getElementById('cart-drawer').classList.contains('open')) renderCart();
  } catch(_) {}
}

function updateCartBadge() {
  const badge = document.getElementById('cart-badge');
  const count = state.cart?.items?.length || 0;
  badge.style.display = count ? 'flex' : 'none';
  badge.textContent = count > 9 ? '9+' : count;
}

function openCart() {
  if (!state.token) { openModal(); return; }
  document.getElementById('cart-drawer').classList.add('open');
  document.getElementById('overlay').classList.add('open');
  renderCart();
}
function closeCart() {
  document.getElementById('cart-drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

function renderCart() {
  const items = state.cart?.items || [];
  const el = document.getElementById('cart-items');
  const footer = document.getElementById('cart-footer');

  if (!items.length) {
    el.innerHTML = `<div class="cart-empty"><div class="cart-empty-icon">🛒</div><p>Your cart is empty</p><p style="font-size:.8rem;margin-top:.3rem">Add some products!</p></div>`;
    footer.style.display = 'none';
    return;
  }

  let total = 0;
  el.innerHTML = items.map(item => {
    const price = item.product?.price || 0;
    const sub = price * item.quantity;
    total += sub;
    return `
      <div class="cart-item">
        <div class="ci-icon">${productIcon(item.product?.id || 0)}</div>
        <div class="ci-info">
          <div class="ci-name">${esc(item.product?.name || 'Product')}</div>
          <div class="ci-price">₹${fmt(price)} × ${item.quantity} = ₹${fmt(sub)}</div>
        </div>
        <span class="ci-qty">×${item.quantity}</span>
        <button class="ci-remove" title="Remove" onclick="removeItem(${item.id})">🗑</button>
      </div>`;
  }).join('');

  document.getElementById('cart-total-value').textContent = `₹${fmt(total)}`;
  footer.style.display = '';
}

async function addToCart(productId, btn) {
  if (!state.token) { openModal(); return; }
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = '…';
  try {
    const cart = await api(`/cart/items?productId=${productId}&quantity=1`, { method: 'POST' });
    state.cart = cart;
    updateCartBadge();
    toast('Added to cart 🛒', 'success');
    btn.textContent = '✓ Added';
    setTimeout(() => { btn.disabled = false; btn.textContent = orig; }, 1200);
  } catch(e) {
    toast(e.message, 'error');
    btn.disabled = false; btn.textContent = orig;
  }
}

async function removeItem(cartItemId) {
  try {
    await api(`/cart/items/${cartItemId}`, { method: 'DELETE' });
    await loadCart();
    renderCart();
    toast('Item removed', 'success');
  } catch(e) { toast(e.message, 'error'); }
}

async function placeOrder() {
  const btn = document.querySelector('.order-btn');
  btn.disabled = true; btn.textContent = 'Placing order…';
  try {
    await api('/orders', { method: 'POST' });
    state.cart = null;
    updateCartBadge();
    closeCart();
    toast('Order placed successfully! 🎉', 'success');
    await loadCart();
  } catch(e) {
    toast(e.message, 'error');
  }
  btn.disabled = false; btn.textContent = 'Place Order 🚀';
}

// ── ORDERS ────────────────────────────────────────────────────────────────────
async function loadOrders() {
  const el = document.getElementById('orders-list');
  el.innerHTML = `<div style="color:var(--muted);font-size:.9rem">Loading orders…</div>`;
  if (!state.token) {
    el.innerHTML = `<div class="empty-state"><div class="big">🔒</div><p>Sign in to view your orders.</p></div>`;
    return;
  }
  try {
    const orders = await api('/orders');
    if (!orders || !orders.length) {
      el.innerHTML = `<div class="empty-state"><div class="big">📋</div><p>No orders yet. Start shopping!</p></div>`;
      return;
    }
    el.innerHTML = orders.map(o => `
      <div class="order-card">
        <div class="order-header">
          <div class="order-id">Order <span>#${o.id}</span></div>
          <span class="status-badge status-${o.status}">${o.status}</span>
        </div>
        <div class="order-items-list">
          ${(o.items||[]).map(i => `
            <div class="oi-row">
              <span class="oi-name">${esc(i.productName || 'Item')} × ${i.quantity}</span>
              <span class="oi-subtotal">₹${fmt(i.subtotal || 0)}</span>
            </div>`).join('')}
        </div>
        <div class="order-total-row">
          <span>Total</span>
          <span>₹${fmt(o.totalAmount || 0)}</span>
        </div>
      </div>`).join('');
  } catch(e) {
    el.innerHTML = `<div class="empty-state"><p>Could not load orders: ${e.message}</p></div>`;
  }
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span class="toast-icon">${type==='success'?'✓':'✕'}</span> ${esc(msg)}`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmt(n) {
  return Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// ── KEYBOARD ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeCart(); }
});
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
// Prevent cart drawer close on inner click
document.getElementById('cart-drawer').addEventListener('click', e => e.stopPropagation());

// ── BOOT ──────────────────────────────────────────────────────────────────────
renderAuthArea();
loadCategories();
loadProducts();
if (state.token) loadCart();
</script>
</body>
</html>
